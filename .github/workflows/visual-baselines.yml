name: Update visual baselines
# Run by hand (Actions tab -> Update visual baselines -> Run workflow). Generates the Playwright
# screenshot baselines on Linux, as the spec requires, and commits them to the branch it ran on.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and install browser
        working-directory: web
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Generate baselines
        working-directory: web
        env:
          CI: "1"
          PYTHON: python
        run: npx playwright test --project=desktop -g "visual regression" --update-snapshots
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/e2e/app.spec.ts-snapshots
          git diff --cached --quiet && echo "no change" || git commit -m "test(web): update visual baselines (Linux)" && git push
