name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - uses: actions/cache@v4
        with:
          path: data/models
          key: ocr-models-${{ hashFiles('backend/app/distill/ocr.py') }}
      - name: Fetch OCR models (pinned revision + SHA-256)
        working-directory: backend
        run: python scripts/fetch_ocr_models.py
      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pytest -q
      - name: OCR synthetic-scan benchmark (two engines; report kept as artifact)
        working-directory: backend
        env:
          PYTHONUTF8: "1"
        run: |
          python scripts/ocr_benchmark.py --synthetic --out ocr-benchmark/synthetic
          cat ocr-benchmark/synthetic.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ocr-benchmark
          path: backend/ocr-benchmark

  backend-postgres:
    # Phase 8: the same test suite on PostgreSQL (the server database).
    name: backend-tests-postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fidelity_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - uses: actions/cache@v4
        with:
          path: data/models
          key: ocr-models-${{ hashFiles('backend/app/distill/ocr.py') }}
      - name: Fetch OCR models
        working-directory: backend
        run: python scripts/fetch_ocr_models.py
      - name: Run backend tests on PostgreSQL
        working-directory: backend
        env:
          PYTHONUTF8: "1"
          FIDELITY_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fidelity_test
          FIDELITY_TRUST_URL: postgresql://postgres:postgres@localhost:5432/fidelity_test
        run: python -m pytest -q

  backend-macos:
    # Phase 6: the Mac mini's platform. Same suite on macOS (Apple silicon), Apple Vision OCR benchmarked
    # against the other engines, throughput measured, and the locked dependency list for the installer.
    name: backend-tests-macos
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          brew install tesseract
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest ocrmac
      - uses: actions/cache@v4
        with:
          path: data/models
          key: ocr-models-${{ hashFiles('backend/app/distill/ocr.py') }}
      - name: Fetch OCR models
        working-directory: backend
        run: python scripts/fetch_ocr_models.py
      - name: Run backend tests on macOS
        working-directory: backend
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q
      - name: Benchmark OCR engines incl. Apple Vision; choose the best two
        working-directory: backend
        env:
          PYTHONUTF8: "1"
        run: |
          python scripts/ocr_benchmark.py --synthetic --out mac-bench/ocr --select
          cat mac-bench/ocr.md >> "$GITHUB_STEP_SUMMARY"
          python scripts/perf_benchmark.py --pdf mac-bench/ocr.source.pdf --pages 3 --ocr-pages 2 --label "GitHub macOS runner (Apple silicon)" --out mac-bench/perf
          cat mac-bench/perf.md >> "$GITHUB_STEP_SUMMARY"
          pip freeze --exclude-editable > mac-bench/requirements-macos.lock
      - uses: actions/upload-artifact@v4
        with:
          name: macos-benchmarks-and-lock
          path: backend/mac-bench

  frontend:
    name: frontend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Unit tests (Vitest)
        working-directory: web
        run: npm test
      - name: Type-check and build
        working-directory: web
        run: npm run build
      - name: Lighthouse (performance, accessibility, best practices)
        working-directory: web
        run: npx --yes @lhci/cli@0.14.0 autorun
      - name: Storybook - every component story passes axe in both themes and languages
        working-directory: web
        env:
          PYTHON: python
        run: |
          npm run build-storybook
          npx playwright install --with-deps chromium
          npm run check-stories

  e2e:
    name: e2e-a11y-responsive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build web app
        working-directory: web
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: End-to-end, accessibility, responsive and bilingual tests (Playwright)
        working-directory: web
        env:
          CI: "1"
          PYTHON: python
        run: npm run e2e
      - name: Keep reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            web/playwright-report
            web/test-results
