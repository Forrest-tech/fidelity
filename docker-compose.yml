# Fidelity in Docker. Settings: copy deploy/docker/fidelity.env.example to deploy/docker/fidelity.env (required;
# the Mac one-click script writes one), or create an empty file there to use the built-in SQLite.
#   docker compose up -d --build        start (and rebuild after an update)
#   docker compose logs -f              follow the log
#   docker compose down                 stop (data stays in the volumes)
services:
  fidelity:
    build: .
    image: fidelity:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"          # this machine only; change to "8000:8000" for the office network
    env_file:
      # plain string form: older Docker Compose (before 2.24) rejects the {path, required} form. The file must exist:
      # the one-click start script writes it (SQLite); otherwise copy deploy/docker/fidelity.env.example.
      - deploy/docker/fidelity.env
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach PostgreSQL / Ollama running on this machine
    volumes:
      - fidelity-data:/app/data              # Dropbox/Google connections, OCR models, glossary, work files
      - fidelity-appdata:/app/backend/data   # sign-in secret, job database (when not on PostgreSQL)
      # a copy of every daily backup outside Docker, in a normal folder of this computer (FIDELITY_BACKUP_COPY_DIR)
      - ${FIDELITY_BACKUP_HOST_DIR:-./backups}:/backup-copies
volumes:
  fidelity-data:
  fidelity-appdata:
